---
layout: default
title: 研究
permalink: /research/
---
<div class="page-title">
  <h1>研究内容</h1>
  <div class="muted">Research</div>
</div>

{% for t in site.data.topics %}
<div class="research-item">
  <div>
    <h3>{{ t.title }}</h3>
    <div class="content">{{ t.body | markdownify }}</div>
    {% if t.methods %}<div class="methods">手法：{{ t.methods }}</div>{% endif %}
  </div>
  {% if t.image %}<img class="fig" src="{{ t.image | relative_url }}" alt="{{ t.title }}" onerror="this.removeAttribute('src')">{% endif %}
</div>
{% endfor %}
