# 出版物（各区分の中で新しいものを上に書く）
#
# category は次の3つのどれか（ページ上でこの順に表示されます）
#   first_published : 主著（出版済み）
#   first_submitted : 主著（投稿中）
#   coauthor        : 共著
#
# 1 件の書き方：
# - category: first_published
#   year: 2026
#   authors: "<me>T. Takase</me>, T. Nakamura, ..."   # <me>…</me> で囲むと太字
#   title: "論文タイトル"
#   journal: "Icarus"
#   volume: "420"           # 任意
#   pages: "115xxx"         # 任意
#   doi: "10.1016/..."      # 任意
#   status: "submitted"     # 任意（submitted / in revision / in press など）
#   pdf: "/assets/pdf/xxx.pdf"   # 任意
#
# 主著の投稿中論文が出版されたら category を first_published に変え、status を消して doi を入れる。
# doi または url があると、タイトルがそのリンクになります。
# status が submitted のときは「Submitted to 誌名」と表示されます。

# ---- 主著（投稿中） ----
- category: first_submitted
  year: 2026
  authors: "<me>T. Takase</me>, M. Matsumoto, T. Nakamura, R. Kawada, S. Ishida, Y. Enokido, R. Sakurai, S. Yamashita, Y. Takahashi, K. Sakamoto, S. Tachibana"
  title: "Chemical characteristics of amorphous Mg phosphate phases in samples from carbonaceous asteroids Bennu and Ryugu"
  journal: "Meteoritics & Planetary Science"
  status: "submitted"

- category: first_submitted
  year: 2026
  authors: "<me>T. Takase</me>, T. Nakamura, Y. Fukuda, K. Tsutsui, S. Ishida, R. Kawada, K. Amano, Y. Enokido, K. Sakamoto, S. Tachibana"
  title: "Submillimeter-scale diversity of near- to mid-infrared reflectance spectra within samples from asteroids Ryugu and Bennu: Records of space weathering and aqueous alteration"
  journal: "Icarus"
  status: "submitted"

# ---- 共著 ----
- category: coauthor
  year: 2026
  authors: "S. Ishida, T. Nakamura, K. Tsutsui, <me>T. Takase</me>, R. Kawada, K. Amano, M. Matsuoka, M. Matsumoto, Y. Takahashi, T. Kawai, S. Yamashita, Y. Enokido, J. Matsuno, M. Uesugi, E. Tatsumi, M. Ichikawa, X.-D. Zou, K. Sakamoto, S. Tachibana"
  title: "Reflectance spectroscopy of returned samples reveals the aqueous alteration and space weathering histories of carbonaceous asteroids Bennu and Ryugu"
