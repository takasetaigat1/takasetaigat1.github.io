<!doctype html>
<html lang="{{ page.lang | default: site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.author.name_ja }} ({{ site.author.name_en }})</title>
  <meta name="description" content="{{ page.description | default: site.author.name_ja }} — {{ site.author.affiliation_ja }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
</head>
<body>
<div class="wrap">
  {% include sidebar.html %}
  <main class="main">
    {{ content }}
    <footer class="foot">
      <span>© {{ site.time | date: "%Y" }} {{ site.author.name_en }}</span>
      <span>Last updated: {{ site.time | date: "%Y/%m/%d" }}</span>
    </footer>
  </main>
</div>
<script>
  // モバイル用ナビの開閉
  var btn = document.querySelector('.nav-toggle');
  var nav = document.querySelector('.side-nav');
  if (btn && nav) btn.addEventListener('click', function () {
    var open = nav.classList.toggle('open');
    btn.setAttribute('aria-expanded', open);
  });
</script>
</body>
</html>
