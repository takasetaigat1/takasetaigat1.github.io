---
layout: default
title: ニュース
permalink: /news/
---
<div class="page-title">
  <h1>ニュース</h1>
  <div class="muted">News</div>
</div>

<ul class="dlist">
  {% for n in site.data.news %}
  <li>
    <span class="dt">{{ n.date | date: "%Y/%m/%d" }}</span>
    <span>{% if n.url %}<a href="{{ n.url }}">{{ n.text }}</a>{% else %}{{ n.text }}{% endif %}{% if n.tag %}<span class="tag">{{ n.tag }}</span>{% endif %}</span>
  </li>
  {% endfor %}
</ul>
